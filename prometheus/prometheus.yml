global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ingester
    static_configs:
      - targets: ["ingester:8001"]
  - job_name: simulator
    static_configs:
      - targets: ["simulator:8002"]
  - job_name: processor
    static_configs:
      - targets: ["processor:8003"]
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
